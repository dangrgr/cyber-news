name: Process

# Phase 2: triage -> extract -> factcheck -> Discord. Offset 15 minutes from
# Ingest so the two workflows don't contend for the same database connection
# at the top of each half-hour.

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npm run migrate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Triage + extract + factcheck + publish
        run: npm run process
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
          MODEL_TRIAGE: ${{ vars.MODEL_TRIAGE }}
          MODEL_EXTRACTION: ${{ vars.MODEL_EXTRACTION }}
          MODEL_FACTCHECK: ${{ vars.MODEL_FACTCHECK }}
          MAX_PROCESS_BATCH: ${{ vars.MAX_PROCESS_BATCH }}

      - name: Generate run summary
        if: always()
        run: npx tsx scripts/gen_run_summary.ts --days=7 > logs/runs/summary.md

      - name: Commit run logs and summary
        if: always()
        # Concurrency keys are per-workflow group, so a different workflow
        # (ingest, investigate) can still race us at git-level — pull --rebase
        # absorbs that race. [skip ci] prevents the auto-commit from
        # re-triggering any CI workflow on push.
        run: |
          if [[ -n "$(git status --porcelain logs/runs/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add logs/runs/
            git commit -m "process: run ${{ github.run_id }} [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "No run logs to commit."
          fi
