name: Standalone news image
on:
  push:
    branches: [main, codex/standalone-news]
    paths: [Dockerfile, .dockerignore, 'package*.json', 'src/**', 'scripts/**', 'patterns/**', 'migrations/**', entities.yaml, .github/workflows/news-image.yml]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run typecheck && npm test
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker build -t "$image" .
          docker push "$image"
