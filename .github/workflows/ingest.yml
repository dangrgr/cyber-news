name: Ingest

on:
  schedule:
    # PRD §8.1 — every 30 minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: log-commit
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npm run migrate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Ingest + dedup + pre-filter
        run: npm run ingest
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Generate run summary
        if: always()
        run: npx tsx scripts/gen_run_summary.ts --days=7 > logs/runs/summary.md

      - name: Commit run logs and summary
        if: always()
        # Serialized with process/investigate via the shared `log-commit`
        # concurrency group. Retry loop is defense in depth against transient
        # push errors and the rare workflow_dispatch race that slips past
        # concurrency. [skip ci] prevents the auto-commit from re-triggering
        # any CI workflow on push.
        run: |
          set -e
          if [[ -z "$(git status --porcelain logs/runs/)" ]]; then
            echo "No run logs to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/runs/
          git commit -m "ingest: run ${{ github.run_id }} [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push 2>/dev/null; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing onto origin/main"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict; aborting and retrying after backoff"
              git rebase --abort
            fi
            sleep $((attempt * 2))
          done

          echo "Failed to push after 5 attempts"
          exit 1
