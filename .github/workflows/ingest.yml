name: Ingest

on:
  schedule:
    # PRD §8.1 — every 30 minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npm run migrate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Ingest + dedup + pre-filter
        run: npm run ingest
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Generate run summary
        if: always()
        run: npx tsx scripts/gen_run_summary.ts --days=7 > logs/runs/summary.md

      - name: Commit run logs and summary
        if: always()
        # Concurrency keys are per-workflow group, so a different workflow
        # (process, investigate) can still race us at git-level — pull --rebase
        # absorbs that race. [skip ci] prevents the auto-commit from
        # re-triggering any CI workflow on push.
        run: |
          if [[ -n "$(git status --porcelain logs/runs/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add logs/runs/
            git commit -m "ingest: run ${{ github.run_id }} [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "No run logs to commit."
          fi
